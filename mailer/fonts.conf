<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  What to use for the fonts the deck asks for and this image does not have.

  Not a nicety. Left to itself, fontconfig answers "I do not know that family"
  with Liberation Mono, a typewriter face. A family that reaches every heading
  through the slide master then puts the whole report's headings in monospace,
  at widths nothing was laid out for. This was measured on the sibling SMOMA
  project rather than assumed, and it is cheaper to carry the rule across than
  to rediscover it on the day the real deck arrives.

  Calibri and Arial need no rule: Carlito and Liberation Sans are installed and
  fontconfig already picks them, which it can do because they are metric
  -compatible by design, so lines break where they were drawn to.

  Outfit is the tool's own face (the font-ui and font-display custom properties
  in results.html) and the one a K1x-branded deck is most likely to name. It is
  a geometric sans with no metric-compatible clone, so Carlito is a judgement
  call about which installed face is closest, and it will change line breaks
  slightly. Recheck this against the real deck, and if K1x can license Outfit
  for a server, drop the .ttf files into the image and delete the rule: a real
  font always beats a substitution.

  Aptos and Söhne Leicht are here because they are PowerPoint's and a common
  house style's defaults, and a deck built elsewhere may carry either without
  anyone intending it.

  (No double hyphens anywhere above. XML forbids them inside a comment, which
  is why the house style of writing a dash as two of them cannot be used here.)
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Outfit</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Söhne Leicht</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
