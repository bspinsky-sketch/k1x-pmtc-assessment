<!doctype html>
<html><head><meta charset="utf-8">
<title>PMTC Output Report -- Cover</title>
<style>
@font-face { font-family:'Outfit'; font-weight:400; src:url('assets/fonts/Outfit-Regular.ttf') format('truetype'); }
@font-face { font-family:'Outfit'; font-weight:700; src:url('assets/fonts/Outfit-Bold.ttf') format('truetype'); }
@font-face { font-family:'Outfit'; font-weight:800; src:url('assets/fonts/Outfit-ExtraBold.ttf') format('truetype'); }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1280px; height:720px; }
.page {
  width:1280px; height:720px; position:relative; overflow:hidden;
  background-image: url('assets/picture1.png');
  background-size: cover; background-position: center;
  font-family: 'Outfit', sans-serif;
}
.logo { position:absolute; top:52px; left:64px; width:132px; height:auto; }
.title-block { position:absolute; left:64px; top:308px; max-width:660px; }
.title {
  font-family:'Outfit'; font-weight:800; font-size:44px; line-height:1.12;
  letter-spacing:-0.01em; color:#FFFFFF;
}
.subhead {
  font-family:'Outfit'; font-weight:400; font-size:18px; line-height:1.5;
  color:rgba(255,255,255,0.72); margin-top:20px; max-width:600px;
}
.meta-row {
  position:absolute; left:64px; right:64px; top:588px;
  display:flex; justify-content:flex-start;
}
.meta-label {
  font-family:'Outfit'; font-weight:400; font-size:11px; letter-spacing:0.18em;
  text-transform:uppercase; color:#F5D000; margin-bottom:6px;
}
.meta-value {
  font-family:'Outfit'; font-weight:700; font-size:22px; color:#FFFFFF;
}
.meta-sub {
  font-family:'Outfit'; font-weight:400; font-size:12px; letter-spacing:0.06em;
  color:#C4CBCC; margin-top:4px;
}
</style></head>
<body>
<div class="page">
  <img class="logo" src="assets/k1x_logo.svg">
  <div class="title-block">
    <div class="title">Private Market Tax<br>Capability Report</div>
    <div class="subhead">Where your private market tax operation stands today, how it compares to peer firms, and your roadmap to reach the next level.</div>
  </div>
  <div class="meta-row">
    <div>
      <div class="meta-label">Prepared for</div>
      <div class="meta-value">{{ results.company }}</div>
      <div class="meta-sub">{{ generated_date }}</div>
    </div>
  </div>
</div>
</body></html>
